name: Release Windows

# Compila Ordenasion en Windows en dos formatos (un único .exe y una carpeta
# portable en .zip), los verifica con el smoke aislado y con un arranque real,
# y los publica como pre-release de GitHub al empujar una etiqueta vX.Y.Z o al
# lanzarlo a mano con «publicar» (crea la etiqueta v<APP_VERSION> en el commit).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "OrganizadorAlpha_OPTIMIZED.spec"
      - "requirements*.txt"
      - "packaging/**"
      - "main_fluent.py"
      - "src/**"
      - "tools/**"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar la pre-release v<APP_VERSION> (crea la etiqueta)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publicar) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-build.txt pytest

      - name: Tests en Windows
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = python -c "from src.utils.version import APP_VERSION; print(APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con APP_VERSION $version"
          }

      - name: Compilar (.exe único y carpeta portable)
        run: |
          $python = (Get-Command python).Source
          $base = & $python -c "import sys; print(sys.base_prefix)"
          $scripts = Split-Path $python
          # PATH acotado: no recoger DLL de otras herramientas instaladas en el runner
          $env:PATH = "$scripts;$base;$env:WINDIR\System32;$env:WINDIR"
          & $python -m PyInstaller --clean --noconfirm --distpath dist-onefile --workpath build-onefile OrganizadorAlpha_OPTIMIZED.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller (onefile) falló" }
          $env:ORDENASION_ONEDIR = "1"
          & $python -m PyInstaller --clean --noconfirm --distpath dist-onedir --workpath build-onedir OrganizadorAlpha_OPTIMIZED.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller (onedir) falló" }

      - name: Smoke de los dos formatos
        run: |
          $name = python -c "from src.utils.version import EXECUTABLE_NAME; print(EXECUTABLE_NAME)"
          New-Item -ItemType Directory -Force smoke | Out-Null
          $targets = @{ "onefile" = "dist-onefile/$name.exe"; "onedir" = "dist-onedir/$name/$name.exe" }
          foreach ($kind in $targets.Keys) {
            $exe = Resolve-Path $targets[$kind]
            $env:ORDENASION_SMOKE = "1"
            $env:ORDENASION_SMOKE_REPORT = Join-Path $PWD "smoke/smoke-$kind.json"
            $env:ORDENASION_DATA_DIR = Join-Path $env:RUNNER_TEMP "ordenasion-smoke-$kind"
            $env:QT_QPA_PLATFORM = "offscreen"
            $process = Start-Process -FilePath $exe -WindowStyle Hidden -Wait -PassThru
            Get-Content $env:ORDENASION_SMOKE_REPORT
            $report = Get-Content $env:ORDENASION_SMOKE_REPORT -Raw | ConvertFrom-Json
            if ($process.ExitCode -ne 0 -or $report.status -ne "ok") {
              Get-Content ($env:ORDENASION_SMOKE_REPORT -replace '\.json$', '.log') -ErrorAction SilentlyContinue
              throw "Smoke $kind fallido (código $($process.ExitCode), estado $($report.status))"
            }
          }

      - name: Arranque real (sin smoke, con discos)
        run: |
          # Abre el ejecutable como un usuario: plataforma Qt real, gestor de
          # discos activo. Falla si la ventana no aparece en 90 s y enseña el
          # log y el volcado de bloqueo para ver dónde se quedó.
          $name = python -c "from src.utils.version import EXECUTABLE_NAME; print(EXECUTABLE_NAME)"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:ORDENASION_SMOKE -ErrorAction SilentlyContinue
          $targets = [ordered]@{ "onefile" = "dist-onefile/$name.exe"; "onedir" = "dist-onedir/$name/$name.exe" }
          $failed = @()
          foreach ($kind in $targets.Keys) {
            $exe = Resolve-Path $targets[$kind]
            $data = Join-Path $env:RUNNER_TEMP "ordenasion-real-$kind"
            $env:ORDENASION_DATA_DIR = $data
            $log = Join-Path $data "logs/ordenasion.log"
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process -FilePath $exe -PassThru
            $visible = $false
            while ($clock.Elapsed.TotalSeconds -lt 90) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern "ventana visible" -Quiet)) { $visible = $true; break }
              if ($process.HasExited) { break }
              Start-Sleep -Milliseconds 250
            }
            $seconds = [math]::Round($clock.Elapsed.TotalSeconds, 1)
            Start-Sleep -Seconds 1
            & taskkill /PID $process.Id /T /F | Out-Null
            Write-Host "===== Arranque real $kind · visible=$visible · $seconds s ====="
            Get-ChildItem (Join-Path $data "logs") -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.Name)"; Get-Content $_.FullName
            }
            "- Arranque real $kind`: $(if ($visible) { "ventana visible en $seconds s" } else { "NO apareció en $seconds s" })" >> $env:GITHUB_STEP_SUMMARY
            if (-not $visible) { $failed += $kind }
          }
          if ($failed) { throw "La ventana no apareció: $($failed -join ', ')" }

      - name: Organizar de punta a punta (ventana real)
        run: |
          # Analiza una carpeta temporal, marca la confirmación de la vista
          # previa, organiza, cierra el resumen y deshace, con la plataforma
          # gráfica real y sobre cada ejecutable (y desde el código).
          $name = python -c "from src.utils.version import EXECUTABLE_NAME; print(EXECUTABLE_NAME)"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:ORDENASION_SMOKE -ErrorAction SilentlyContinue
          $env:ORDENASION_E2E = "1"
          New-Item -ItemType Directory -Force smoke | Out-Null
          $targets = [ordered]@{ "codigo" = $null; "onefile" = "dist-onefile/$name.exe"; "onedir" = "dist-onedir/$name/$name.exe" }
          $failed = @()
          foreach ($kind in $targets.Keys) {
            $env:ORDENASION_DATA_DIR = Join-Path $env:RUNNER_TEMP "ordenasion-e2e-$kind"
            $env:ORDENASION_E2E_LOG = Join-Path $PWD "smoke/e2e-$kind.log"
            if ($targets[$kind]) {
              $process = Start-Process -FilePath (Resolve-Path $targets[$kind]) -Wait -PassThru
            } else {
              $process = Start-Process -FilePath python -ArgumentList "-X", "faulthandler", "main_fluent.py" -Wait -PassThru -NoNewWindow
            }
            Write-Host "===== Organizar $kind · código de salida $($process.ExitCode) ====="
            Get-Content $env:ORDENASION_E2E_LOG -ErrorAction SilentlyContinue
            Get-ChildItem (Join-Path $env:ORDENASION_DATA_DIR "logs") -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.Name)"; Get-Content $_.FullName
            }
            "- Organizar $kind`: $(if ($process.ExitCode -eq 0) { 'OK' } else { "FALLO (código $($process.ExitCode))" })" >> $env:GITHUB_STEP_SUMMARY
            if ($process.ExitCode -ne 0) { $failed += $kind }
          }
          if ($failed) { throw "Organizar falló en: $($failed -join ', ')" }

      - name: Empaquetar, tamaño y SHA-256
        id: hash
        run: |
          $name = python -c "from src.utils.version import EXECUTABLE_NAME; print(EXECUTABLE_NAME)"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "dist-onefile/$name.exe" "dist/$name.exe"
          Compress-Archive -Path "dist-onedir/$name" -DestinationPath "dist/${name}_portable.zip" -CompressionLevel Optimal
          $lines = @()
          foreach ($file in @("dist/$name.exe", "dist/${name}_portable.zip")) {
            $item = Get-Item $file
            $sha = (Get-FileHash $item -Algorithm SHA256).Hash.ToLower()
            $mb = [math]::Round($item.Length / 1MB, 1)
            $lines += "$sha  $($item.Name)"
            $key = if ($item.Extension -eq ".zip") { "zip" } else { "exe" }
            "${key}=$($item.FullName)" >> $env:GITHUB_OUTPUT
            "${key}_name=$($item.Name)" >> $env:GITHUB_OUTPUT
            "${key}_sha=$sha" >> $env:GITHUB_OUTPUT
            "${key}_mb=$mb" >> $env:GITHUB_OUTPUT
            "- $($item.Name): $mb MB · SHA-256 ``$sha``" >> $env:GITHUB_STEP_SUMMARY
          }
          $lines | Out-File -Encoding ascii "dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v5
        with:
          name: ordenasion-windows
          path: |
            dist/
            smoke/
          retention-days: 30

      - name: Publicar pre-release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from src.utils.version import APP_VERSION; print(APP_VERSION)"
          $tag = "v$version"
          python tools/release_notes.py $version --out release-notes.md `
            --exe "${{ steps.hash.outputs.exe_name }}" --mb "${{ steps.hash.outputs.exe_mb }}" --sha "${{ steps.hash.outputs.exe_sha }}" `
            --portable "${{ steps.hash.outputs.zip_name }}" --portable-mb "${{ steps.hash.outputs.zip_mb }}" --portable-sha "${{ steps.hash.outputs.zip_sha }}"
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron generar las notas" }
          # Con una etiqueta ya empujada se usa tal cual; a mano, se crea en este commit
          gh release create $tag "${{ steps.hash.outputs.exe }}" "${{ steps.hash.outputs.zip }}" "dist/SHA256SUMS.txt" `
            --title "Ordenasion $version" --notes-file release-notes.md --prerelease --target "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar la release $tag" }
