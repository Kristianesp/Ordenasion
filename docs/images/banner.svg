<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Ordenasion Alpha 3.5 — Tu espacio, en orden</title>
  <desc id="desc">Identidad azul de Ordenasion: carpeta y paneles ordenados. Organiza archivos, descubre qué ocupa espacio y cuida tu biblioteca musical.</desc>
  <defs>
    <linearGradient id="ocean" x2="1" y2="1"><stop stop-color="#101e36"/><stop offset=".6" stop-color="#142c43"/><stop offset="1" stop-color="#143c49"/></linearGradient>
    <linearGradient id="folder" x2=".3" y2="1"><stop stop-color="#71d5ff"/><stop offset=".5" stop-color="#168ce1"/><stop offset="1" stop-color="#0560b1"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#addbff" stop-opacity=".2"/><stop offset="1" stop-color="#9ccfff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#e2f5ff"/><stop offset="1" stop-color="#9edcff"/></linearGradient>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#ocean)"/>
  <path d="M680 400 1050 0M820 400 1190 0M960 400 1330 0" stroke="#54caff" stroke-opacity=".08" stroke-width="50"/>
  <rect x="770" y="52" width="306" height="280" rx="32" fill="url(#glass)" stroke="#a2dcff" stroke-opacity=".18" transform="rotate(9 923 192)"/>
  <rect x="797" y="78" width="306" height="280" rx="32" fill="url(#glass)" stroke="#a2dcff" stroke-opacity=".25" transform="rotate(-6 950 218)"/>
  <rect x="48" y="40" width="160" height="28" rx="14" fill="#349ee4" fill-opacity=".17" stroke="#77c8ff" stroke-opacity=".3"/>
  <text x="128" y="59" text-anchor="middle" font-family="Nunito" font-size="12" font-weight="600" fill="#b9e6ff" letter-spacing="1.7">WINDOWS · 4.0.0</text>
  <text x="48" y="137" font-family="Nunito" font-size="61" font-weight="700" letter-spacing="-2.5" fill="#f3f9ff">Ordenasion<tspan font-size="23" font-weight="400" letter-spacing=".2" fill="#a6cce3"> Alpha</tspan></text>
  <text x="51" y="190" font-family="Nunito" font-size="31" font-weight="400" fill="#8ed8ff">Tu espacio, en orden.</text>
  <text x="51" y="237" font-family="Nunito" font-size="18" fill="#c2d6e7">Organiza archivos. Descubre qué ocupa espacio.</text>
  <text x="51" y="266" font-family="Nunito" font-size="18" fill="#c2d6e7">Cuida tu biblioteca musical.</text>
  <g font-family="Nunito" font-size="13" fill="#e0f2ff">
    <rect x="51" y="315" width="143" height="33" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#c8e9ff" stroke-opacity=".15"/><text x="122" y="336" text-anchor="middle">Vista previa</text>
    <rect x="205" y="315" width="143" height="33" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#c8e9ff" stroke-opacity=".15"/><text x="276" y="336" text-anchor="middle">Claro y oscuro</text>
    <rect x="359" y="315" width="143" height="33" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#c8e9ff" stroke-opacity=".15"/><text x="430" y="336" text-anchor="middle">Control local</text>
